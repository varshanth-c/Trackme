<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="logoShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>

    <!-- Gold gradient -->
    <linearGradient id="goldBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFC300"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- Moving light gradient -->
    <linearGradient id="shimmerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="-20%" stop-color="white" stop-opacity="0" />
      <stop offset="0%" stop-color="white" stop-opacity="0.8" />
      <stop offset="20%" stop-color="white" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="2 0" dur="2.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Combine base gold and shimmer -->
    <mask id="textMask">
      <text x="100" y="100" text-anchor="middle" dominant-baseline="central"
            font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="white">
        ₹
      </text>
    </mask>
  </defs>

  <!-- Logo background -->
  <rect x="15" y="15" width="170" height="170" rx="20" ry="20"
        fill="white" stroke="black" stroke-width="6" filter="url(#logoShadow)"/>

  <!-- Inner border -->
  <rect x="25" y="25" width="150" height="150" rx="15" ry="15"
        fill="none" stroke="black" stroke-width="2" opacity="0.3"/>

  <!-- Corner lines -->
  <g stroke="black" stroke-width="3" fill="none">
    <line x1="40" y1="50" x2="50" y2="40"/>
    <line x1="45" y1="55" x2="55" y2="45"/>
    <line x1="150" y1="40" x2="160" y2="50"/>
    <line x1="145" y1="45" x2="155" y2="55"/>
    <line x1="40" y1="150" x2="50" y2="160"/>
    <line x1="45" y1="145" x2="55" y2="155"/>
    <line x1="150" y1="160" x2="160" y2="150"/>
    <line x1="145" y1="155" x2="155" y2="145"/>
  </g>

  <!-- Side decorations -->
  <g fill="black" opacity="0.6">
    <rect x="30" y="95" width="8" height="3" rx="1"/>
    <rect x="30" y="102" width="6" height="3" rx="1"/>
    <rect x="162" y="95" width="8" height="3" rx="1"/>
    <rect x="164" y="102" width="6" height="3" rx="1"/>
    <rect x="95" y="30" width="3" height="8" rx="1"/>
    <rect x="102" y="30" width="3" height="6" rx="1"/>
    <rect x="95" y="162" width="3" height="8" rx="1"/>
    <rect x="102" y="164" width="3" height="6" rx="1"/>
  </g>

  <!-- Rupee with shimmer -->
  <g mask="url(#textMask)">
    <!-- Base gold -->
    <rect x="0" y="0" width="200" height="200" fill="url(#goldBase)"/>
    <!-- Shimmer sweep -->
    <rect x="0" y="0" width="200" height="200" fill="url(#shimmerGradient)"/>
  </g>

  <!-- Corner dots -->
  <g fill="black">
    <circle cx="45" cy="45" r="2"/>
    <circle cx="155" cy="45" r="2"/>
    <circle cx="155" cy="155" r="2"/>
    <circle cx="45" cy="155" r="2"/>
  </g>

  <!-- Highlight dot -->
  <circle cx="80" cy="80" r="4" fill="white" opacity="0.8"/>
</svg>
