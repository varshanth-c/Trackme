<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple black and white logo design -->
  <defs>
    <!-- Shadow filter for depth -->
    <filter id="logoShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- White background square for logo -->
  <rect x="15" y="15" width="170" height="170" rx="20" ry="20"
        fill="white" 
        stroke="black" 
        stroke-width="6" 
        filter="url(#logoShadow)"/>
  
  <!-- Inner square border for depth -->
  <rect x="25" y="25" width="150" height="150" rx="15" ry="15"
        fill="none" 
        stroke="black" 
        stroke-width="2" 
        opacity="0.3"/>
  
  <!-- Corner decorative marks for unique design -->
  <g stroke="black" stroke-width="3" fill="none">
    <!-- Top left corner marks -->
    <line x1="40" y1="50" x2="50" y2="40"/>
    <line x1="45" y1="55" x2="55" y2="45"/>
    
    <!-- Top right corner marks -->
    <line x1="150" y1="40" x2="160" y2="50"/>
    <line x1="145" y1="45" x2="155" y2="55"/>
    
    <!-- Bottom left corner marks -->
    <line x1="40" y1="150" x2="50" y2="160"/>
    <line x1="45" y1="145" x2="55" y2="155"/>
    
    <!-- Bottom right corner marks -->
    <line x1="150" y1="160" x2="160" y2="150"/>
    <line x1="145" y1="155" x2="155" y2="145"/>
  </g>
  
  <!-- Side decorative elements -->
  <g fill="black" opacity="0.6">
    <!-- Left side marks -->
    <rect x="30" y="95" width="8" height="3" rx="1"/>
    <rect x="30" y="102" width="6" height="3" rx="1"/>
    
    <!-- Right side marks -->
    <rect x="162" y="95" width="8" height="3" rx="1"/>
    <rect x="164" y="102" width="6" height="3" rx="1"/>
    
    <!-- Top marks -->
    <rect x="95" y="30" width="3" height="8" rx="1"/>
    <rect x="102" y="30" width="3" height="6" rx="1"/>
    
    <!-- Bottom marks -->
    <rect x="95" y="162" width="3" height="8" rx="1"/>
    <rect x="102" y="164" width="3" height="6" rx="1"/>
  </g>
  
  <!-- Large Rupee Symbol -->
  <text x="100" y="100" 
        text-anchor="middle" 
        dominant-baseline="central"
        font-family="Arial, sans-serif" 
        font-size="72" 
        fill="black" 
        font-weight="700">₹</text>
  
  <!-- Unique corner dots for branding -->
  <g fill="black">
    <circle cx="45" cy="45" r="2"/>
    <circle cx="155" cy="45" r="2"/>
    <circle cx="155" cy="155" r="2"/>
    <circle cx="45" cy="155" r="2"/>
  </g>
  
  <!-- Central highlight -->
  <circle cx="80" cy="80" r="4" 
          fill="white" 
          opacity="0.8"/>
</svg>